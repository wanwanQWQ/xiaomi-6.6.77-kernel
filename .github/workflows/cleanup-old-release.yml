name: Cleanup Old Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-old-release.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete old release and tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'kernel-6.6.77-b86d392df13c69fde0cd84a8da6df2c4ddb6b988';
            const { owner, repo } = context.repo;
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.data.id });
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              console.log('old release and tag deleted');
            } catch (e) {
              console.log('status:', e.status, 'message:', e.message);
              core.setFailed('delete failed: ' + e.message);
            }
